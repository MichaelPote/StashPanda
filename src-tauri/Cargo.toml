[package]
name = "stashpanda"
version = "0.6.0"
description = "A standalone desktop Git GUI that works with your own installed Git"
authors = ["Michael Pote"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stashpanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
async-trait = "0.1.92"
thiserror = "2.0.20"
tracing = "0.1.44"
bstr = "1.13.1"
shlex = "2.0.1"
dunce = "1.0.5"
arc-swap = "1.9.2"
rustc-hash = "2.1.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
smallvec = { version = "1.16.1", features = ["serde", "union"] }
uuid = { version = "1.26.1", features = ["v4", "serde", "v5"] }
which = "8.0.6"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-config = "0.58.0"
ssh-key = { version = "=0.7.0-rc.11", features = ["ppk", "ed25519", "rsa", "ecdsa", "dsa", "encryption", "std", "alloc", "getrandom"] }
rsa = "=0.10.0-rc.18"
pkcs1 = "=0.8.0-rc.4"
aes = "0.9"
cbc = "0.2"
des = "0.9.0"
md-5 = "0.11.0"
base64 = "0.23.1"
zeroize = "1.9.0"
keyring = "4.2.0"
fontdb = "0.24.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The WebView2 settings that Tauri does not expose (see src/webview.rs), at the versions wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"


# Debug builds keep line numbers for our own code (panics and backtraces still
# name the file and line) but no debugger info for dependencies, which is most
# of the size of target/debug. Stepping into dependency code in a debugger is
# not possible with this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

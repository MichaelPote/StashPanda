# Runs the tests on every push to main and every pull request. The installers for each platform
# are built only for a version tag (v0.7.0, as `npm version` makes), or when the workflow is run
# by hand from the Actions tab. Either way the installers then go into a draft GitHub Release for
# v<package.json's version>, to be read over and published by hand on the Releases page; run by
# hand from a branch, the draft is for the commit that was built, and is refused when that
# version is already published. The release also gets latest.json, which installed copies of the
# app read to update themselves; they only see it once the release is published.
#
# Linux builds on Ubuntu 22.04 on purpose: a binary only runs where the C library (glibc) is at
# least as new as the one it was built against, so building on the oldest supported release lets
# the .deb, .rpm and AppImage start on newer ones too. Windows builds only the NSIS installer
# (src-tauri/tauri.windows.conf.json).
#
# macOS is left out for now. To add it, uncomment its entry in the matrix below; a signed build
# also needs an Apple Developer ID certificate and notarization credentials as repository
# secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID), passed to the build step as environment variables.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only unless a job asks for more; only the release job does.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install the Linux build dependencies, and what the tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev openssh-server inotify-tools
      - name: Give Git an identity for the commits the tests make
        run: |
          git config --global user.name "StashPanda CI"
          git config --global user.email "ci@stashpanda.invalid"
      - run: npm ci
      - name: Front-end type check
        run: npx vue-tsc --noEmit
      - name: Front-end tests
        run: npx vitest run
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  build:
    name: Build (${{ matrix.name }})
    needs: test
    # Installers take a while on two machines, so a push to main or a pull request only runs the
    # tests. Run by hand, the workflow builds them and makes a draft release (see the release job).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/rpm/*.rpm.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - name: Windows
            platform: windows-latest
            args: ""
            artifacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          # - name: macOS
          #   platform: macos-latest
          #   # One app for both Apple Silicon and Intel Macs.
          #   args: "--target universal-apple-darwin"
          #   artifacts: |
          #     src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures for the universal build; ignored elsewhere.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install the Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # tauri.release.conf.json turns on the updater's .sig files, signed with the key in these
      # secrets; its public half is in tauri.conf.json. A pull request from a fork gets no
      # secrets, so it builds without them, unsigned.
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          else
            npm run tauri build -- ${{ matrix.args }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stashpanda-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The only job that may write to the repository: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The release is for v<package.json's version>. Pushed as a tag, the tag has to be that:
      # the installers are named after package.json's version, so a tag on a commit still at
      # another version would publish installers that say the wrong version. Run by hand from a
      # branch, the draft is for the commit that was built, and GitHub makes the tag when the
      # draft is published; a version that is already published, or whose tag is on another
      # commit, is refused, so a manual run never touches a release that is out.
      - name: Choose the release's tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
              exit 1
            fi
          else
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$draft" = false ]; then
              echo "::error::$tag is already published. Run npm version to make a new version, then run this again."
              exit 1
            fi
            # The commit an existing tag is on: the peeled ^{} line for an annotated tag.
            on=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | tail -n 1 | cut -f1)
            if [ -n "$on" ] && [ "$on" != "$GITHUB_SHA" ]; then
              echo "::error::The tag $tag is on another commit ($on). Run npm version to make a new version, then run this again."
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      # What the app's updater reads once the release is published. The .sig files go into it,
      # so they are not attached themselves.
      - name: Write latest.json for the updater
        run: node scripts/updater-manifest.mjs release-files "$TAG" latest.json
      # The Linux artifact keeps its deb/, rpm/ and appimage/ folders, so the files are listed one
      # by one. A release left by an earlier run gets the files again instead of failing, and
      # keeps its notes, which may have been edited on the Releases page since; a draft from an
      # earlier manual run moves to this run's commit.
      # The notes are the version's lines in CHANGELOG.md, which `npm version` moved there from
      # "## Unreleased". A version whose changelog has none gets GitHub's notes from the commits.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-files -type f ! -name '*.sig' | sort)
          files+=(latest.json)
          printf 'Attaching %s\n' "${files[@]}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              gh release edit "$TAG" --target "$GITHUB_SHA"
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            if node scripts/release-notes.mjs "$TAG" > release-notes.md; then
              notes=(--notes-file release-notes.md)
            else
              echo "::warning::CHANGELOG.md has no lines for $TAG, so the release notes come from the commits."
              notes=(--generate-notes)
            fi
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              where=(--verify-tag)
            else
              where=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${files[@]}" \
              --title "StashPanda ${TAG#v}" "${notes[@]}" --draft "${where[@]}"
          fi
